<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect QuickNotes for Mac</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth">
    <div class="auth-card">
      <span class="brand-mark big" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </span>
      <h1 id="title">Connect your Mac</h1>
      <p id="message">Sign in so the floating bubble saves straight to your notes.</p>
      <button class="google-btn" id="continue" hidden></button>
      <p class="auth-error" id="error" hidden></p>
      <p><button class="link-btn" id="switch" hidden>Use a different account</button></p>
    </div>
  </div>
  <script type="module" src="link.js"></script>
</body>
</html>
