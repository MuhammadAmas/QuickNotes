<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="icons/icon-48.png" alt="" width="28" height="28">
    <div class="title">
      <b>QuickNotes</b>
      <small id="date"></small>
    </div>
    <a class="icon-btn" id="open-app" href="#" title="Open all notes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
      <span class="visually-hidden">Open all notes</span>
    </a>
  </header>

  <section id="loading" class="center muted">Loading…</section>

  <section id="signed-out" hidden>
    <div class="welcome">
      <p>Save a note for today from any tab. It syncs with QuickNotes on your Mac and phone.</p>
      <button class="google-btn" id="sign-in">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
        Continue with Google
      </button>
      <p class="error" id="auth-error" hidden></p>
    </div>
  </section>

  <section id="signed-in" hidden>
    <form class="composer" id="composer">
      <div class="shot-preview" id="shot-preview" hidden>
        <img id="shot-img" alt="Screenshot of this tab">
        <button type="button" class="shot-remove" id="shot-remove" aria-label="Remove screenshot" title="Remove screenshot">✕</button>
      </div>
      <textarea id="input" rows="1" placeholder="What’s on your mind?" maxlength="10000" aria-label="New note for today"></textarea>
      <div class="composer-foot">
        <button type="button" class="shot-btn" id="shot-btn" title="Attach a screenshot of this tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg>
          Screenshot this tab
        </button>
        <span id="status" class="status"></span>
      </div>
    </form>

    <div class="list-head">
      <span>Today</span>
      <span id="count" class="count"></span>
    </div>
    <ul id="notes" class="notes"></ul>

    <footer class="foot">
      <span id="account" class="muted"></span>
      <button class="link" id="sign-out">Sign out</button>
    </footer>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
